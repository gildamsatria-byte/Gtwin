<title>GTwin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF0EC; --panel:#FAFBF9; --panel2:#F3F6F2; --ink:#16201B; --ink2:#46544D; --muted:#76837C; --line:#D2D9D4; --line2:#E3E8E4;
  --accent:#0E6B5C; --accent2:#0A5549; --accent-soft:#D6EAE5; --on-accent:#FFFFFF; --node:#C98300;
  --good:#0CA30C; --warn:#FAB219; --serious:#EC835A; --crit:#D03B3B; --good-ink:#0B6E0B; --warn-ink:#8A5D00; --crit-ink:#B02A2A;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#E1E0D9; --axis:#C3C2B7;
  --canvas:#E6EAE6; --shadow:0 1px 2px rgba(16,32,27,.06),0 8px 24px rgba(16,32,27,.08);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1311; --panel:#151C19; --panel2:#1A2320; --ink:#E3EAE6; --ink2:#AEBAB4; --muted:#7D8A84; --line:#2A3531; --line2:#222C28;
    --accent:#3DB39C; --accent2:#5CC7B2; --accent-soft:#16332D; --on-accent:#06201B; --node:#F0A92B;
    --good-ink:#3BC93B; --warn-ink:#FAB219; --crit-ink:#F07070;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2C2C2A; --axis:#383835; --canvas:#111816; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1311; --panel:#151C19; --panel2:#1A2320; --ink:#E3EAE6; --ink2:#AEBAB4; --muted:#7D8A84; --line:#2A3531; --line2:#222C28;
  --accent:#3DB39C; --accent2:#5CC7B2; --accent-soft:#16332D; --on-accent:#06201B; --node:#F0A92B;
  --good-ink:#3BC93B; --warn-ink:#FAB219; --crit-ink:#F07070;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#2C2C2A; --axis:#383835; --canvas:#111816; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-stretch:88%;letter-spacing:-.005em;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{height:100%;display:grid;grid-template-columns:84px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;flex:none}
.brand h1{font-size:17px;font-weight:700;white-space:nowrap}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text{min-width:0}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warn)}.dot.alarm{background:var(--crit)}.dot.nodata{background:var(--muted)}
.me{display:flex;align-items:center;gap:8px;min-width:0}
.me img{width:28px;height:28px;border-radius:50%}
.me .who{font-size:12px;line-height:1.2;min-width:0}
.me .who b{display:block;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .who span{color:var(--muted)}
nav.rail{grid-row:2;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:10px 8px}
nav.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:0;background:none;border-radius:10px;color:var(--ink2);cursor:pointer;font-size:11.5px;font-weight:500;position:relative}
nav.rail button svg{width:22px;height:22px}
nav.rail button:hover{background:var(--panel2);color:var(--ink)}
nav.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.rail .badge{position:absolute;top:5px;right:12px;min-width:17px;height:17px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
main{grid-row:2;min-width:0;min-height:0;overflow:auto;position:relative}
.page{max-width:1280px;margin:0 auto;padding-block:22px 40px;padding-inline:24px;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h2{font-size:26px;font-weight:700}
.page-head p{margin:2px 0 0;color:var(--ink2);max-width:68ch}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--panel2);color:var(--ink)}
.btn.danger{color:var(--crit-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=url],input[type=search],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);font-weight:500;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:700}
.card-b{padding:14px 16px}
.note{font-size:12.5px;color:var(--ink2);background:var(--panel2);border:1px dashed var(--line);border-radius:8px;padding:9px 11px}
.empty{color:var(--muted);font-size:13px;padding:18px;text-align:center}

/* tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--panel2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.ok{color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.chip.warn{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.chip.alarm,.chip.crit{color:var(--crit-ink);border-color:color-mix(in srgb,var(--crit) 50%,var(--line))}
.chip.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.prio{display:inline-block;width:4px;align-self:stretch;border-radius:2px;background:var(--line)}
.prio.Rendah{background:var(--muted)}.prio.Sedang{background:var(--warn)}.prio.Tinggi{background:var(--serious)}.prio.Kritis{background:var(--crit)}

/* model view */
.mv{height:100%;display:grid;grid-template-columns:270px minmax(0,1fr) 350px;min-height:0}
.mv-side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.mv-side.right{border-right:0;border-left:1px solid var(--line)}
.mv-side .hd{padding:12px 14px 10px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:8px}
.mv-side .bd{overflow:auto;flex:1;min-height:0}
.stage{position:relative;min-width:0;min-height:0;background:var(--canvas)}
#viewer{position:absolute;inset:0}
#viewer canvas{display:block;width:100%;height:100%;touch-action:none}
.toolbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.toolbar>*{pointer-events:auto}
.tb-group{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow);align-items:center}
.tb-group select{border:0;padding:5px 8px;width:auto;background:transparent}
.tb-group .btn{border-color:transparent;padding:6px 9px}
.tb-group .btn.on{border-color:var(--accent)}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.model-meta{position:absolute;left:12px;bottom:12px;font-size:11.5px;color:var(--ink2);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:min(420px,calc(100% - 24px))}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--canvas) 80%,transparent);z-index:3}
.overlay .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;width:min(320px,90%);box-shadow:var(--shadow)}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.tree{font-size:13px;padding:6px 6px 16px}
.tree details>summary{list-style:none;cursor:pointer;padding:5px 8px;border-radius:6px;display:flex;align-items:center;gap:6px}
.tree details>summary::-webkit-details-marker{display:none}
.tree details>summary:hover{background:var(--panel2)}
.tree details>summary::before{content:"";width:0;height:0;border-left:5px solid var(--muted);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s;flex:none}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree .cnt{margin-left:auto;color:var(--muted);font-size:11.5px}
.tree .kids{padding-left:14px}
.tree .el{display:flex;gap:6px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:4px 8px 4px 22px;border-radius:6px;cursor:pointer;color:var(--ink2)}
.tree .el:hover{background:var(--panel2);color:var(--ink)}
.tree .el.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tree .el span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .el small{color:var(--muted);font-family:var(--f-mono);font-size:10.5px;margin-left:auto;flex:none}
.insp{padding:16px;display:flex;flex-direction:column;gap:14px}
.insp h3{font-size:19px;font-weight:700;line-height:1.2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
details.pset{border:1px solid var(--line2);border-radius:8px;background:var(--panel)}
details.pset>summary{cursor:pointer;padding:7px 10px;font-weight:600;font-size:12.5px;display:flex;gap:8px;align-items:center}
details.pset>summary small{color:var(--muted);font-weight:400;margin-left:auto}
details.pset table{width:100%;border-collapse:collapse;font-size:12px}
details.pset td{padding:5px 10px;border-top:1px solid var(--line2);vertical-align:top;overflow-wrap:anywhere}
details.pset td:first-child{color:var(--ink2);width:46%}
.big{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:40px;line-height:1}
.big small{font-size:16px;font-weight:600;color:var(--ink2);margin-left:4px}
.feed{position:relative;border-radius:8px;overflow:hidden;background:#0b0f0d;aspect-ratio:16/9;max-width:100%}
.feed canvas{width:100%;height:100%;display:block}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .lab{font-size:12px;color:var(--ink2);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:32px;line-height:1.05}
.kpi .val small{font-size:14px;color:var(--ink2);font-weight:600;margin-left:3px}
.kpi .foot{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dash-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.span7{grid-column:span 7}.span5{grid-column:span 5}.span6{grid-column:span 6}.span4{grid-column:span 4}.span8{grid-column:span 8}.span12{grid-column:span 12}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:7px 9px;font-size:12px;white-space:nowrap;z-index:2;display:none}
.tip b{font-weight:600}
.list-row{display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line2);font-size:13px}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.list-row .grow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .grow span{color:var(--muted);font-size:12px}
.cond{display:inline-flex;gap:3px}
.cond i{width:12px;height:8px;border-radius:2px;background:var(--line)}

/* modal */
dialog{border:0;padding:0;border-radius:14px;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(620px,calc(100% - 32px));max-height:calc(100% - 48px)}
dialog::backdrop{background:rgba(8,14,12,.45)}
.m-h{padding:16px 18px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line2)}
.m-h h3{font-size:19px;font-weight:700}
.m-b{padding:14px 18px;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:calc(100vh - 200px)}
.m-f{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line2)}
.check-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.condpick{display:flex;gap:6px;flex-wrap:wrap}
.condpick button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px}
.condpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 60%,var(--line))}
.banner.crit{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))}
.icon-status{width:16px;height:16px;flex:none;margin-top:2px}

.mobile-only{display:none}
@media (max-width:1180px){ .mv{grid-template-columns:240px minmax(0,1fr) 310px} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:960px){
  .mv{grid-template-columns:minmax(0,1fr);grid-template-rows:62vh auto;height:auto}
  .mv-side.left{display:none}
  .mv-side.left.open{display:flex;position:absolute;z-index:4;top:0;left:0;bottom:0;width:min(300px,85%);box-shadow:var(--shadow)}
  .mv-side.right{border-left:0;border-top:1px solid var(--line)}
  .mobile-only{display:inline-flex}
  .dash-grid>*{grid-column:span 12}
}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .top{grid-column:1}
  nav.rail{grid-row:3;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));justify-content:space-around;overflow-x:auto}
  nav.rail button{padding:6px 6px;font-size:10.5px;flex:1;min-width:56px}
  nav.rail .badge{right:8px;top:2px}
  main{grid-row:2}
  .page{padding-inline:16px;padding-block:16px 28px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .me .who{display:none}
  #syncPill span:last-child{display:none}
  .brand h1{font-size:15px;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{display:none}
  .page-head h2{font-size:22px}
  .kpi .val{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="17" height="20" rx="1.5" fill="none" stroke="var(--accent)" stroke-width="2.2"/><path d="M20 15h8v14h-8" fill="none" stroke="var(--accent)" stroke-width="2.2"/><path d="M7 14h3M13 14h3M7 19h3M13 19h3M7 24h3M13 24h3" stroke="var(--ink2)" stroke-width="2"/><circle cx="24" cy="7" r="3.2" fill="var(--node)"/></svg>
      <div class="brand-text"><h1>GTwin</h1><div class="sub"><span id="bldName">Memuat model…</span><span id="bldSub"></span></div></div>
    </div>

/* ============================ charts ============================ */
function niceTicks(min, max, n = 4) {

  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), err = step0 / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;

  return t;
}
function lineChart(el, o) {

  let vals = pts.map(p => p[1]).concat((o.refs || []).map(r => r.v)); let y0 = Math.min(...vals), y1 = Math.max(...vals);
  if (o.zero) y0 = Math.min(0, y0);

  if (x1 === x0) x1 = x0 + 1;
  const X = t => pad.l + (t - x0) / (x1 - x0) * (W - pad.l - pad.r), Y = v => pad.t + (1 - (v - y0) / (y1 - y0)) * (H - pad.t - pad.b);
  const xt = []; const hr = 3600e3, span = x1 - x0, stepH = span > 20 * hr ? 6 : span > 8 * hr ? 3 : 1; for (let t = Math.ceil(x0 / (stepH * hr)) * stepH * hr; t <= x1; t += stepH * hr) xt.push(t);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.series.map(s => s.name).join(", "))}">`;
  ticks.forEach(v => svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${pad.l - 8}" y="${Y(v) + 4}" text-anchor="end" class="num">${fNum(v, Math.abs(y1 - y0) < 5 ? 1 : 0)}</text>`);
  xt.forEach(t => svg += `<text x="${X(t)}" y="${H - 6}" text-anchor="middle">${fTime(t)}</text>`);
  (o.refs || []).forEach(r => svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(r.v)}" y2="${Y(r.v)}" stroke="var(--crit)" stroke-width="1.2" stroke-dasharray="4 4" opacity=".7"/><text x="${W - pad.r}" y="${Y(r.v) - 4}" text-anchor="end">${esc(r.label)} ${fNum(r.v, o.dec || 0)}</text>`);
  o.series.forEach(s => {
    const d = s.points.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
    if (o.area && o.series.length === 1) svg += `<path d="${d}L${X(s.points[s.points.length - 1][0])} ${Y(y0)}L${X(s.points[0][0])} ${Y(y0)}Z" fill="${s.color}" opacity=".14"/>`;
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lp = s.points[s.points.length - 1]; if (lp) svg += `<circle cx="${X(lp[0])}" cy="${Y(lp[1])}" r="4" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`;
  });
  svg += `<line class="xh" x1="0" x2="0" y1="${pad.t}" y2="${H - pad.b}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/><rect x="${pad.l}" y="${pad.t}" width="${W - pad.l - pad.r}" height="${H - pad.t - pad.b}" fill="transparent" class="hit"/></svg>`;
  const legend = o.series.length > 1 ? `<div class="legend">${o.series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";

  const svgEl = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = el.querySelector(".xh");
  el.querySelector(".hit").addEventListener("pointermove", e => {
    const r = svgEl.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * W, t = x0 + (sx - pad.l) / (W - pad.l - pad.r) * (x1 - x0);
    const rows = o.series.map(s => { let best = null; s.points.forEach(p => { if (!best || Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p; }); return [s, best]; }).filter(x => x[1]);
    if (!rows.length) return; const bx = X(rows[0][1][0]);
    xh.setAttribute("x1", bx); xh.setAttribute("x2", bx); xh.setAttribute("visibility", "visible");
    tip.innerHTML = `<div style="color:var(--muted)">${fDT(rows[0][1][0])}</div>` + rows.map(([s, p]) => `<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:6px"></i>${o.series.length > 1 ? esc(s.name) + ": " : ""}<b class="num">${fNum(p[1], o.dec || 0)}</b> ${esc(o.unit || "")}</div>`).join("");

}
function barChart(el, o) { // o: {cats:[], series:[{name,color,values}], stacked, unit}
  const W = Math.max(260, el.clientWidth || 600), H = o.height || 200, pad = { l: 34, r: 10, t: 10, b: 26 };
  const tot = o.cats.map((_, i) => o.stacked ? o.series.reduce((a, s) => a + s.values[i], 0) : Math.max(...o.series.map(s => s.values[i])));
  const ticks = niceTicks(0, Math.max(1, ...tot), 4), y1 = ticks[ticks.length - 1];
  const Y = v => pad.t + (1 - v / y1) * (H - pad.t - pad.b), bw = (W - pad.l - pad.r) / o.cats.length, barW = Math.min(34, bw * 0.6);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(v => svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${pad.l - 6}" y="${Y(v) + 4}" text-anchor="end">${fNum(v)}</text>`);
  o.cats.forEach((c, i) => {

  });

  el.innerHTML = (o.series.length > 1 ? `<div class="legend">${o.series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "") + svg;
}
function roundTopBar(x, y, w, h, r) { r = Math.min(r, h, w / 2); return `M${x} ${y + h}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h}Z`; }

function spark(pts) {
  if (pts.length < 2) return "";
  const w = 120, h = 28, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys) || 1;
  const X = t => (t - x0) / (x1 - x0 || 1) * (w - 4) + 2, Y = v => h - 3 - (v - y0) / ((y1 - y0) || 1) * (h - 6);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
  const l = pts[pts.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}L${X(l[0])} ${h}L${X(pts[0][0])} ${h}Z" fill="var(--s1)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--s1)" stroke-width="1.5"/><circle cx="${X(l[0])}" cy="${Y(l[1])}" r="2.5" fill="var(--s1)"/></svg>`;
}

async function driveSync() {

  if (!S.mcp) { setMsg('<div class="banner warn">' + ICON.warn + '<div>Konektor tidak tersedia pada tampilan ini. Buka halaman di claude.ai saat masuk ke akun Anda.</div></div>'); return; }

  const folder = ($("#gdFolder") && $("#gdFolder").value.trim()) || (S.config.aim && S.config.aim.folderId) || "";
  const uploads = [["aim.json", JSON.stringify(pkg.json, null, 2), "application/json", true], ...Object.entries(pkg.files).map(([n, c]) => [n, c, "text/csv", false])];
  const done = [];
  try {
    for (const [name, content, mime, raw] of uploads) {
      const input = { title: prefix + name.replace(/\.csv$/, ""), textContent: content, contentMimeType: mime };
      if (raw) { input.title = prefix + name; input.disableConversionToGoogleType = true; }
      if (folder) input.parentId = folder;
      const res = await S.mcp.callTool("Google Drive", "create_file", input);
      const p = res && res.payload; const id = p && (p.id || (p.file && p.file.id)) || null;
      done.push({ name: input.title, id });
    }
    const data = { lastSync: Date.now(), files: done, folderId: folder || null, by: S.me.id || null };
    try { if (S.config.aim) await patch("config", "aim", data); else await put("config", "aim", data); } catch (e) { }
    setMsg('<div class="banner">' + ICON.ok + `<div>${done.length} berkas diunggah ke Google Drive${folder ? " (folder " + esc(folder) + ")" : " (My Drive)"}.</div></div>`);

    else if (code === "needs_reauth") h = "Sesi Google Drive kedaluwarsa. Hubungkan ulang Google Drive di claude.ai → Pengaturan → Konektor.";
    else if (code === "not_in_manifest") h = "Akses Google Drive untuk halaman ini ditolak. Muat ulang halaman dan izinkan Google Drive saat diminta.";
    else if (code === "blocked_by_policy" || code === "approval_required") h = "Kebijakan organisasi memblokir unggahan ke Google Drive dari halaman ini.";
    else if (code === "tool_error" && /scope|insufficient|permission/i.test(msg)) h = "Koneksi Google Drive Anda hanya memiliki izin <b>baca</b>. Hubungkan ulang Google Drive di claude.ai → Pengaturan → Konektor dengan izin membuat file, atau gunakan <b>Unduh paket AIM</b> lalu unggah manual.";
    else if (code === "server_unavailable" || code === "upstream_error") h = "Google Drive tidak merespons. Periksa apakah ada berkas yang sudah terunggah sebelum mencoba lagi.";
    else h = "Unggahan gagal: " + esc(msg || code || "tidak diketahui");

function guessCat(el) {
  if (!el) return "Lainnya"; const t = el.type;
  if (/UNITARY|CHILLER|FAN|PUMP|AIR|DUCT|BOILER/.test(t)) return "Mekanikal";
  if (/ELECTRIC|LIGHT|SWITCH|OUTLET|CABLE/.test(t)) return "Elektrikal";
  if (/FIRE/.test(t)) return "Proteksi kebakaran";
  if (/SANITARY|PIPE|VALVE|TANK/.test(t)) return "Plumbing";
  if (/TRANSPORT/.test(t)) return "Transportasi vertikal";
  if (/COLUMN|BEAM|FOOTING|PILE/.test(t)) return "Struktur";

      await put("config", "model", { assetId: r.id, name: S.modelInfo.name, size: blob.size, uploadedAt: Date.now(), by: S.me.id || null });
      S.modelInfo.source = "team"; S.modelInfo.assetId = r.id; renderAll(); toast("Model tim diperbarui.");
    } catch (e) { toast(e && e.code === "too_large" ? "Model terlalu besar." : e && e.code === "quota_exceeded" ? "Kuota penyimpanan penuh." : e && e.code === "unsupported_type" ? "Tipe file ditolak oleh penyimpanan." : "Gagal menyimpan model tim."); }
  });
}

/* ============================ live tick ============================ */
setInterval(() => {
  if (!S.sensors.length) return;
  V.refreshSensors();
  $$("[data-live]").forEach(el => { const s = S.sensors.find(x => x.id === el.dataset.live); if (!s) return; const c = current(s), T = STYPES[s.type]; el.textContent = fmtVal(s, c.v) + (T.unit && c.v != null ? " " + T.unit : ""); });
  $$("[data-live-big]").forEach(el => { const s = S.sensors.find(x => x.id === el.dataset.liveBig); if (!s) return; const c = current(s), T = STYPES[s.type]; el.innerHTML = fmtVal(s, c.v) + (T.unit && c.v != null && s.type !== "smoke" ? `<small>${esc(T.unit)}</small>` : ""); });
  $$("canvas[data-feed]").forEach(cv => { const s = S.sensors.find(x => x.id === cv.dataset.feed); if (s) drawFeed(cv, s); });
  renderRail();
}, 5000);
setInterval(() => { if (S.tab === "dash" && !modal.open) renderTab("dash"); }, 60000);
let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (S.tab === "dash") renderTab("dash"); if (S.selSensor && S.tab === "model") renderInspector(); }, 250); });

boot();
</script>
